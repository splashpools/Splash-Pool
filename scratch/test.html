<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; padding: 50px; }
  img { width: 500px; border: 1px solid red; }
</style>
</head>
<body>
  <div id="svg-container"></div>
  <script>
    fetch('../img/logo.svg')
      .then(res => res.text())
      .then(text => {
        document.getElementById('svg-container').innerHTML = text;
        const svg = document.querySelector('svg');
        svg.style.width = '800px';
        svg.style.height = 'auto';
        
        // Remove existing strokes
        document.querySelectorAll('path').forEach(p => {
          p.style.stroke = 'none';
        });

        // Add filter
        const defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS('http://www.w3.org/2000/svg', 'defs'), svg.firstChild);
        defs.innerHTML = `
          <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="dilated" />
            <feFlood flood-color="white" result="white" />
            <feComposite in="white" in2="dilated" operator="in" result="outline" />
            
            <feMerge>
              <feMergeNode in="outline" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        `;
        svg.querySelector('#g10').setAttribute('filter', 'url(#sticker)');
      });
  </script>
</body>
</html>
